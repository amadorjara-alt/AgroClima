<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f8f6">
  <meta name="description" content="Actualiza de forma segura la contraseña de tu cuenta CompraSmart AI.">
  <title>Restablecer contraseña | CompraSmart AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="auth-body">
<main class="auth-page">
  <header class="auth-nav">
    <a href="index.html" class="brand" aria-label="CompraSmart AI, inicio"><span class="brand-icon">C</span><span class="brand-name">CompraSmart<span class="brand-ai"> AI</span></span></a>
    <a href="login.html" class="back-link">← Volver al acceso</a>
  </header>
  <section class="auth-layout" style="grid-template-columns:minmax(0,1fr);width:min(470px,calc(100% - 32px));min-height:calc(100svh - 145px)">
    <section class="auth-card" aria-labelledby="resetTitle">
      <div class="auth-card-header">
        <div class="auth-icon"><i class="fa-solid fa-lock" aria-hidden="true"></i></div>
        <span class="auth-card-eyebrow">SEGURIDAD DE LA CUENTA</span>
        <h2 id="resetTitle">Nueva contraseña</h2>
        <p>Elige una contraseña segura para recuperar el acceso.</p>
      </div>
      <form id="resetPasswordForm" class="auth-form">
        <div class="form-group">
          <label for="newPassword">Nueva contraseña</label>
          <div class="password-wrapper">
            <input type="password" id="newPassword" minlength="8" maxlength="72" autocomplete="new-password" placeholder="Mínimo 8 caracteres" required>
            <button type="button" class="toggle-password" data-toggle-password="newPassword" aria-label="Mostrar contraseña" aria-pressed="false"><i class="fa-solid fa-eye" aria-hidden="true"></i></button>
          </div>
        </div>
        <div class="form-group">
          <label for="confirmNewPassword">Confirmar contraseña</label>
          <div class="password-wrapper">
            <input type="password" id="confirmNewPassword" minlength="8" maxlength="72" autocomplete="new-password" placeholder="Repite la contraseña" required>
            <button type="button" class="toggle-password" data-toggle-password="confirmNewPassword" aria-label="Mostrar contraseña" aria-pressed="false"><i class="fa-solid fa-eye" aria-hidden="true"></i></button>
          </div>
        </div>
        <button type="submit" class="auth-submit" id="resetPasswordButton" disabled>Actualizar contraseña <span aria-hidden="true">→</span></button>
        <p id="resetPasswordMessage" class="form-message" role="status" aria-live="polite"></p>
      </form>
      <a href="login.html" class="auth-register">Volver a iniciar sesión</a>
    </section>
  </section>
  <footer class="auth-footer"><span>© 2026 CompraSmart AI</span><span>Tu información, protegida.</span></footer>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0" defer></script>
<script src="js/supabase.js" defer></script>
<script src="js/main.js" defer></script>
<script src="js/reset-password.js" defer></script>
</body>
</html>
