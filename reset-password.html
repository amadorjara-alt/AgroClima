<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f3f7ee"><meta name="description" content="Restablece de forma segura tu acceso a AgroClima."><title>Restablecer contraseña | AgroClima</title><link rel="stylesheet" href="css/agroclima.css"></head>
<body class="agro-auth"><header class="wrap auth-head"><a class="brand" href="index.html"><span class="brand-mark">A</span><span>Agro<span>Clima</span></span></a><a href="login.html">← Volver al acceso</a></header>
<main class="auth-card"><span class="eyebrow">SEGURIDAD DE LA CUENTA</span><h1>Recuperar acceso</h1><p>Solicita un enlace por correo. Cuando lo abras, podrás guardar una contraseña nueva en esta página.</p>
<form id="recoveryForm"><label for="recoveryEmail">Correo electrónico</label><input id="recoveryEmail" type="email" autocomplete="email" required><button id="recoveryButton" class="button button-green" type="submit">Enviar enlace de recuperación</button><p id="recoveryMessage" class="auth-message" role="status" aria-live="polite"></p></form>
<hr style="margin:24px 0;border:0;border-top:1px solid #e4e9df"><h2>Elegir nueva contraseña</h2><form id="resetPasswordForm"><label for="newPassword">Nueva contraseña</label><input id="newPassword" type="password" minlength="8" autocomplete="new-password" required><label for="confirmNewPassword">Confirma tu contraseña</label><input id="confirmNewPassword" type="password" minlength="8" autocomplete="new-password" required><button id="resetPasswordButton" class="button button-green" type="submit">Actualizar contraseña</button><p id="resetPasswordMessage" class="auth-message" role="status" aria-live="polite"></p></form></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script><script src="js/supabase.js"></script><script src="js/agro-auth.js" defer></script></body></html>
