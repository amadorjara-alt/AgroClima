<!doctype html>
<html lang="es"><head><link rel="icon" href="assets/agroclima-mark.svg" type="image/svg+xml"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f3f7ee"><meta name="description" content="Restablece de forma segura tu acceso a AgroClima."><title>Restablecer contraseña | AgroClima</title><link rel="stylesheet" href="css/agroclima.css"></head>
<body class="agro-auth"><header class="wrap auth-head"><a class="brand" href="index.html"><img class="brand-mark-image" src="assets/agroclima-mark.svg" alt=""><span>Agro<span>Clima</span></span></a><a href="login.html">← Volver al acceso</a></header>
<main class="auth-card"><span class="eyebrow">SEGURIDAD DE LA CUENTA</span><h1>Recuperar acceso</h1><p>Solicita un enlace por correo. Cuando lo abras, podrás guardar una contraseña nueva en esta página.</p>
<form id="recoveryForm"><label for="recoveryEmail">Correo electrónico</label><input id="recoveryEmail" type="email" autocomplete="email" required><button id="recoveryButton" class="button button-green" type="submit">Enviar enlace de recuperación</button><p id="recoveryMessage" class="auth-message" role="status" aria-live="polite"></p></form>
<hr style="margin:24px 0;border:0;border-top:1px solid #e4e9df"><h2>Elegir nueva contraseña</h2><form id="resetPasswordForm"><label for="newPassword">Nueva contraseña</label><div class="password-field"><input id="newPassword" type="password" minlength="8" autocomplete="new-password" required><button class="password-toggle" type="button" data-toggle-password="newPassword" aria-label="Mostrar contraseña" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.3-6 9.5-6 9.5 6 9.5 6-3.3 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.7"/><path class="eye-lash" d="m4.6 6.1-1.4-1.4M8 4.4l-.5-2M16 4.4l.5-2M19.4 6.1l1.4-1.4"/><path class="eye-slash" d="M4 20 20 4"/></svg></button></div><label for="confirmNewPassword">Confirma tu contraseña</label><div class="password-field"><input id="confirmNewPassword" type="password" minlength="8" autocomplete="new-password" required><button class="password-toggle" type="button" data-toggle-password="confirmNewPassword" aria-label="Mostrar contraseña" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.3-6 9.5-6 9.5 6 9.5 6-3.3 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.7"/><path class="eye-lash" d="m4.6 6.1-1.4-1.4M8 4.4l-.5-2M16 4.4l.5-2M19.4 6.1l1.4-1.4"/><path class="eye-slash" d="M4 20 20 4"/></svg></button></div><button id="resetPasswordButton" class="button button-green" type="submit">Actualizar contraseña</button><p id="resetPasswordMessage" class="auth-message" role="status" aria-live="polite"></p></form></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script><script src="js/supabase.js"></script><script src="js/agro-auth.js" defer></script></body></html>
