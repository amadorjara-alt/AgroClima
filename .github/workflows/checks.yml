name: Validación de AgroClima
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node --check js/supabase.js
      - run: node --check js/agro-auth.js
      - run: node --check js/agro-dashboard.js
